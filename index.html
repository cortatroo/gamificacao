<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conquistas Diárias</title>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --primary: #4CAF50;
            --text-main: #ffffff; --text-muted: #aaaaaa; --accent: #2196F3;
        }
        body {
            margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center;
        }
        .app-container {
            width: 100%; max-width: 480px; min-height: 100vh;
            padding: 20px; padding-bottom: 80px; box-sizing: border-box;
        }
        h1, h2 { margin-top: 0; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        
        /* Formulários */
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9em;}
        input[type="text"], input[type="number"] {
            width: 100%; padding: 10px; border-radius: 6px;
            border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box;
        }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        button {
            width: 100%; padding: 12px; border-radius: 6px; border: none; 
            background-color: var(--accent); color: white; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        button.btn-success { background-color: var(--primary); }
        button:active { transform: scale(0.98); }

        /* Navegação Inferior */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg);
            display: flex; justify-content: space-around; padding: 10px 0;
            border-top: 1px solid #333; z-index: 100; padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        .nav-item { color: var(--text-muted); text-align: center; cursor: pointer; flex: 1; font-size: 0.8em;}
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-icon { font-size: 1.5em; display: block; margin-bottom: 2px; }

        /* Abas */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Calendário Real */
        .calendar-header { text-align: center; font-weight: bold; margin-bottom: 15px; color: var(--accent); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .weekday { font-size: 0.7em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px;}
        .day {
            background: #2a2a2a; border-radius: 8px; aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer;
        }
        .day.empty { background: transparent; cursor: default;}
        .day:active:not(.empty) { transform: scale(0.9); }
        .day.worked { background-color: var(--primary); color: white; box-shadow: 0 0 8px rgba(76, 175, 80, 0.4); }

        /* Itens e Status */
        .status-bar {
            display: flex; justify-content: space-between; background: var(--card-bg); 
            padding: 12px; border-radius: 8px; margin-bottom: 20px; position: sticky; top: 10px; z-index: 10;
            border: 1px solid var(--primary);
        }
        .status-val { font-size: 1.2em; font-weight: bold; color: var(--primary); }
        .item-card {
            background: #2a2a2a; border-radius: 10px; padding: 15px; margin-bottom: 12px; cursor: pointer; position: relative;
        }
        .item-card:active { transform: scale(0.98); }
        .item-header { display: flex; justify-content: space-between; margin-bottom: 8px;}
        .item-title { font-weight: bold; font-size: 1.1em; }
        .progress-bg { background: #444; height: 10px; border-radius: 5px; width: 100%; overflow: hidden;}
        .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.4s; }
        .conquistado { border: 2px solid var(--primary); opacity: 0.8; }
        .badge { position: absolute; top: 10px; right: 10px; background: var(--primary); color: #000; font-size: 0.7em; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        /* Lista Histórico */
        .hist-item { border-bottom: 1px solid #333; padding: 10px 0; font-size: 0.9em; }
        .hist-date { color: var(--text-muted); font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 style="text-align: center; color: var(--primary); margin-bottom: 20px;">🎯 Conquistas Diárias</h1>
        
        <!-- SETUP (Aparece apenas se não iniciado) -->
        <div class="card" id="setup-card">
            <h2>Planejamento do Mês</h2>
            <div class="input-group">
                <label>Total de Entradas (Salário + Extras R$)</label>
                <input type="number" id="input-entradas" placeholder="Ex: 1500">
            </div>
            <div class="input-group">
                <label>Meta de Dias Trabalhados</label>
                <input type="number" id="input-dias" placeholder="Ex: 20">
            </div>
            <button onclick="iniciarMes()">Iniciar Mês</button>
        </div>

        <!-- ABA 1: INÍCIO (Calendário e Alocação) -->
        <div id="tab-home" class="tab-content">
            <div class="status-bar">
                <div style="text-align:center;">
                    <div style="font-size:0.8em; color:var(--text-muted)">Valor do Dia</div>
                    <div class="status-val" id="lbl-diaria">R$ 0,00</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:0.8em; color:var(--text-muted)">Dias Livres</div>
                    <div class="status-val" id="lbl-livres" style="color:var(--accent);">0</div>
                </div>
            </div>

            <div class="card">
                <div class="calendar-header" id="mes-atual-label">MÊS ATUAL</div>
                <div class="calendar-grid" id="calendar"></div>
            </div>

            <div class="card">
                <h2>Meus Itens</h2>
                <div id="items-list"></div>
            </div>
        </div>

        <!-- ABA 2: NOVO ITEM -->
        <div id="tab-add" class="tab-content">
            <div class="card">
                <h2>Cadastrar Novo Item</h2>
                <div class="input-group">
                    <label>Nome do Item / Conta</label>
                    <input type="text" id="novo-item-nome" placeholder="Ex: Conta de Água">
                </div>
                <div class="input-group">
                    <label>Valor Total (R$)</label>
                    <input type="number" id="novo-item-valor" placeholder="Ex: 85.50">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="novo-item-fixo" style="width: 20px; height: 20px;">
                    <label for="novo-item-fixo" style="margin:0;">Conta Fixa (Mensal)</label>
                </div>
                <button class="btn-success" onclick="salvarNovoItem()" id="btn-salvar-item">Salvar Item</button>
            </div>
        </div>

        <!-- ABA 3: HISTÓRICO -->
        <div id="tab-history" class="tab-content">
            <div class="card">
                <h2>Histórico de Conquistas</h2>
                <button onclick="carregarHistorico()" style="margin-bottom: 15px; font-size: 0.8em; background:#333;">🔄 Atualizar Histórico</button>
                <div id="historico-list">
                    <p style="color:var(--text-muted); font-size: 0.9em;">Carregando ou nenhum item conquistado ainda...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav" id="bottom-nav" style="display:none;">
        <div class="nav-item active" onclick="mudarAba('home', this)">
            <span class="nav-icon">🏠</span>Início
        </div>
        <div class="nav-item" onclick="mudarAba('add', this)">
            <span class="nav-icon">➕</span>Novo Item
        </div>
        <div class="nav-item" onclick="mudarAba('history', this); carregarHistorico();">
            <span class="nav-icon">📜</span>Histórico
        </div>
    </nav>

    <script>
        // COLE SUA URL AQUI
        const API_URL = "https://script.google.com/macros/s/AKfycbwVdzjwsqAX_qjDd5rH0yCBevIHGiejLyMFU4MwWzwU0PE5UJOpyTa1n7aOvBBhzHMK/exec"; 
        
        let estado = { entradas: 0, metaDias: 0, valorDiaria: 0, diariasLivres: 0, diasMarcados: [],
            itens: [
                {id: 1, nome: "Exemplo (Modo Teste)", valorTotal: 100, valorAlocado: 0, status: "Pendente"}
            ]
        };

        function iniciarMes() {
            const entradas = parseFloat(document.getElementById('input-entradas').value);
            const dias = parseInt(document.getElementById('input-dias').value);
            if(!entradas || !dias) return alert("Preencha as entradas e a meta de dias.");
            
            estado.entradas = entradas; estado.metaDias = dias; estado.valorDiaria = entradas / dias;
            
            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('bottom-nav').style.display = 'flex';
            document.getElementById('tab-home').classList.add('active');
            
            atualizarInterface(); renderizarCalendarioReal(); carregarItensDaAPI();
        }

        function mudarAba(abaId, elementoNav) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById('tab-' + abaId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            elementoNav.classList.add('active');
        }

        function atualizarInterface() {
            document.getElementById('lbl-diaria').innerText = `R$ ${estado.valorDiaria.toFixed(2)}`;
            document.getElementById('lbl-livres').innerText = estado.diariasLivres;
            renderizarItens();
        }

        function renderizarCalendarioReal() {
            const cal = document.getElementById('calendar');
            cal.innerHTML = '';
            
            const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            diasSemana.forEach(d => {
                const div = document.createElement('div'); div.className = 'weekday'; div.innerText = d; cal.appendChild(div);
            });

            const hoje = new Date();
            const ano = hoje.getFullYear(); const mes = hoje.getMonth();
            const primeiroDia = new Date(ano, mes, 1).getDay();
            const diasNoMes = new Date(ano, mes + 1, 0).getDate();

            document.getElementById('mes-atual-label').innerText = hoje.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();

            // Células vazias
            for(let i = 0; i < primeiroDia; i++) {
                const div = document.createElement('div'); div.className = 'day empty'; cal.appendChild(div);
            }

            // Dias do mês
            for(let i = 1; i <= diasNoMes; i++) {
                const div = document.createElement('div'); div.className = 'day';
                div.innerText = i;
                if(estado.diasMarcados.includes(i)) div.classList.add('worked');
                div.onclick = () => marcarDia(i, div);
                cal.appendChild(div);
            }
        }

        function marcarDia(dia, elemento) {
            if(estado.diasMarcados.includes(dia)) return; 
            estado.diasMarcados.push(dia); estado.diariasLivres++;
            elemento.classList.add('worked');
            atualizarInterface();
        }

        function renderizarItens() {
            const lista = document.getElementById('items-list');
            lista.innerHTML = '';
            estado.itens.forEach(item => {
                const perc = Math.min((item.valorAlocado / item.valorTotal) * 100, 100);
                const conquistado = item.status === 'Conquistado' || perc >= 100;
                
                const card = document.createElement('div');
                card.className = `item-card ${conquistado ? 'conquistado' : ''}`;
                card.onclick = () => alocarValor(item.id);
                
                let html = `
                    <div class="item-header">
                        <div class="item-title">${item.nome} ${item.fixo === 'Sim' ? '📌' : ''}</div>
                        <div style="font-size: 0.8em; color:var(--text-muted)">R$ ${item.valorAlocado.toFixed(2)} / R$ ${item.valorTotal.toFixed(2)}</div>
                    </div>
                    <div class="progress-bg"><div class="progress-fill" style="width: ${perc}%"></div></div>
                `;

                if (conquistado) html += `<div class="badge">✓ PAGO</div>`;
                else {
                    const faltam = Math.ceil((item.valorTotal - item.valorAlocado) / estado.valorDiaria);
                    html += `<div style="font-size: 0.75em; color: var(--text-muted); margin-top: 5px; text-align: right;">Faltam ${faltam} dias</div>`;
                }
                card.innerHTML = html; lista.appendChild(card);
            });
        }

        async function carregarItensDaAPI() {
            if(API_URL.includes("COLE_A_URL")) return;
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getDados' }) });
                const json = await res.json();
                if(json.success && json.data.itens.length > 0) { estado.itens = json.data.itens; renderizarItens(); }
            } catch(e) { console.error(e); }
        }

        async function alocarValor(idItem) {
            const item = estado.itens.find(i => i.id == idItem);
            if(item.status === 'Conquistado' || item.valorAlocado >= item.valorTotal) return;
            if(estado.diariasLivres <= 0) return alert("Marque um dia de trabalho no calendário primeiro!");

            estado.diariasLivres--; item.valorAlocado += estado.valorDiaria;
            if(item.valorAlocado >= item.valorTotal) { item.valorAlocado = item.valorTotal; item.status = 'Conquistado'; }
            atualizarInterface();

            if(!API_URL.includes("COLE_A_URL")) {
                const dt = new Date(); const mesAno = `${("0" + (dt.getMonth() + 1)).slice(-2)}/${dt.getFullYear()}`;
                fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'alocarValor', idItem: idItem, valorDia: estado.valorDiaria, mesAno: mesAno }) });
            }
        }

        async function salvarNovoItem() {
            const nome = document.getElementById('novo-item-nome').value;
            const valor = parseFloat(document.getElementById('novo-item-valor').value);
            const fixo = document.getElementById('novo-item-fixo').checked;
            const btn = document.getElementById('btn-salvar-item');

            if(!nome || !valor) return alert("Preencha nome e valor do item.");
            
            btn.innerText = "Salvando..."; btn.disabled = true;

            // Salva na Planilha
            if(!API_URL.includes("COLE_A_URL")) {
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'adicionarItem', nome: nome, valor: valor, fixo: fixo }) });
                    const json = await res.json();
                    if(json.success) {
                        estado.itens.push(json.data); // Adiciona na tela
                        alert("Item cadastrado com sucesso!");
                        document.getElementById('novo-item-nome').value = '';
                        document.getElementById('novo-item-valor').value = '';
                        atualizarInterface();
                        mudarAba('home', document.querySelectorAll('.nav-item')[0]); // Volta pra home
                    }
                } catch(e) { alert("Erro ao salvar."); }
            } else {
                // Modo Teste
                estado.itens.push({id: Date.now(), nome: nome, valorTotal: valor, valorAlocado: 0, fixo: fixo ? 'Sim' : 'Não', status: "Pendente"});
                atualizarInterface(); mudarAba('home', document.querySelectorAll('.nav-item')[0]);
            }
            btn.innerText = "Salvar Item"; btn.disabled = false;
        }

        async function carregarHistorico() {
            const divHistorico = document.getElementById('historico-list');
            if(API_URL.includes("COLE_A_URL")) {
                divHistorico.innerHTML = "<p>Configure a API para ver o histórico real.</p>"; return;
            }
            
            divHistorico.innerHTML = "<p>Carregando histórico...</p>";
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getHistorico' }) });
                const json = await res.json();
                
                if(json.success && json.data.historico.length > 0) {
                    divHistorico.innerHTML = '';
                    json.data.historico.forEach(h => {
                        divHistorico.innerHTML += `
                            <div class="hist-item">
                                <div style="display:flex; justify-content:space-between; font-weight:bold;">
                                    <span>${h.item}</span>
                                    <span style="color:var(--primary)">R$ ${parseFloat(h.valor).toFixed(2)}</span>
                                </div>
                                <div class="hist-date">Pago em ${h.data} • Custou ${h.dias} dias trabalhados</div>
                            </div>
                        `;
                    });
                } else {
                    divHistorico.innerHTML = "<p>Nenhuma conquista registrada ainda.</p>";
                }
            } catch(e) { divHistorico.innerHTML = "<p>Erro ao buscar histórico.</p>"; }
        }
    </script>
</body>
</html>
